name: Intel Mac Podman acceptance probe

on:
  push:
    branches:
      - ci/rootless-podman-macos-proof
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-podman-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-podman:
    name: Intel Mac / Podman VM / published 1.1.5
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      SPACEAPP_TELEMETRY: "0"
      PODMAN_COMPOSE_WARNING_LOGS: "false"
      SPACEAPP_CI_RUNTIME_VERSION: "1.1.5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.23.0"
      - name: Install checksum-pinned official Intel Podman and Compose
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/podman.pkg" https://github.com/podman-container-tools/podman/releases/download/v5.8.7/podman-installer-macos-amd64.pkg
          echo "a05640de459ce1a7ecb8ece4af107f64523e5fa9ecda78f01df11d606394b1e2  $RUNNER_TEMP/podman.pkg" | shasum -a 256 --check
          sudo installer -pkg "$RUNNER_TEMP/podman.pkg" -target /
          export PATH="/opt/podman/bin:$PATH"
          echo "/opt/podman/bin" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/docker-compose" https://github.com/docker/compose/releases/download/v5.6.0/docker-compose-darwin-x86_64
          echo "c76e3abf5fde1aeb3bd7c7306ff15bef2246afc1f9e54832a0a050dd7cdfb2f8  $RUNNER_TEMP/docker-compose" | shasum -a 256 --check
          chmod 700 "$RUNNER_TEMP/docker-compose"
          echo "PODMAN_COMPOSE_PROVIDER=$RUNNER_TEMP/docker-compose" >> "$GITHUB_ENV"
          podman --version
          "$RUNNER_TEMP/docker-compose" version
          sysctl kern.hv_support
      - name: Create isolated rootless machine
        run: |
          podman machine init --cpus 4 --memory 8192 --disk-size 24 --rootful=false spaceapp-ci-proof
          podman machine start spaceapp-ci-proof
          podman machine inspect spaceapp-ci-proof
          podman info --format '{{json .Host}}'
      - name: Small runtime acceptance with published 1.1.5 (not 1.1.6 proof)
        run: node scripts/podman-launcher-smoke.mjs small
      - name: Remove only this disposable fixture machine
        if: always()
        run: podman machine rm --force spaceapp-ci-proof
