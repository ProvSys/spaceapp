name: Platform matrix

on:
  pull_request:
    paths:
      - "packages/run-spaceapp/**"
      - "scripts/podman-launcher-smoke.mjs"
      - ".github/ci/podman-brew.service"
      - ".github/ci/podman-brew.apparmor"
      - "package-lock.json"
      - ".github/workflows/platform-matrix.yml"
  push:
    branches:
      - main
      - ci/rootless-podman-validation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher:
    name: Launcher / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22.23.0"
          - os: macos-latest
            node: "22.23.0"
          - os: windows-latest
            node: "22.23.0"
          - os: windows-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install workspace dependencies on supported hosts
        if: runner.arch != 'ARM64'
        run: npm ci

      - name: Install source workspace for the intentional x64 package rejection test
        if: runner.arch == 'ARM64'
        run: npm ci --force

      - run: npm test -w run-spaceapp
      - run: npm run check -w run-spaceapp
      - run: npm run pack:dry-run -w run-spaceapp
      - run: node packages/run-spaceapp/bin/spaceapp.mjs --version

  podman:
    name: Rootless Podman / small / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SPACEAPP_TELEMETRY: "0"
      PODMAN_COMPOSE_WARNING_LOGS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.0"
      - name: Ensure Podman >=5 on the hosted runner
        shell: bash
        run: |
          # Ephemeral runner bootstrap only; the launcher never changes host
          # delegation, linger or AppArmor policy on an operator machine.
          sudo loginctl enable-linger "$(id -un)"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          sudo systemctl set-property "user@$(id -u).service" Delegate=yes
          # ubuntu-latest currently supplies 4.9; do not silently test an
          # unsupported engine. Homebrew includes current OCI/network helpers.
          if test "$(podman version --format '{{.Client.Version}}' | cut -d. -f1)" -lt 5; then
            /home/linuxbrew/.linuxbrew/bin/brew install podman
            echo '/home/linuxbrew/.linuxbrew/bin' >> "$GITHUB_PATH"
            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
            if command -v apparmor_parser >/dev/null; then
              sudo apparmor_parser --replace .github/ci/podman-brew.apparmor
            fi
            systemctl --user stop podman.socket podman.service
            install -D -m 644 .github/ci/podman-brew.service "$HOME/.config/systemd/user/podman.service"
            systemctl --user daemon-reload
          fi
          podman --version
          test "$(podman version --format '{{.Client.Version}}' | cut -d. -f1)" -ge 5
          systemctl --user start podman.socket
          podman info --format '{{json .Host.Security.Rootless}}'
      - name: Install pinned Compose provider
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/docker-compose" https://github.com/docker/compose/releases/download/v5.6.0/docker-compose-linux-x86_64
          echo "40343e21ca777173e69cff5dbafeb37c6f81f3b0d57d9e597f036e95eb63e76a $RUNNER_TEMP/docker-compose" | sha256sum --check
          chmod 700 "$RUNNER_TEMP/docker-compose"
          echo "PODMAN_COMPOSE_PROVIDER=$RUNNER_TEMP/docker-compose" >> "$GITHUB_ENV"
      - name: Install, readyz, backup and purge isolated small profile
        run: node scripts/podman-launcher-smoke.mjs small
